<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <title>Sender WA — SewaWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="app-body">

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <i class="fab fa-whatsapp"></i>
        <span>Sewa<span class="highlight">WA</span></span>
      </div>
      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item"><i class="fas fa-home"></i> <span>Dashboard</span></a>
        <a href="/devices" class="nav-item active"><i class="fas fa-mobile-alt"></i> <span>Devices</span></a>
        <a href="/wallet" class="nav-item"><i class="fas fa-wallet"></i> <span>Wallet</span></a>
        <a href="/referral" class="nav-item"><i class="fas fa-gift"></i> <span>Referral</span></a>
        <a href="/admin" class="nav-item" id="adminLink" style="display:none;"><i class="fas fa-cog"></i> <span>Admin</span></a>
        <a href="#" class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
      </nav>
      <div class="sidebar-footer">
        <span class="user-badge"><i class="fas fa-user"></i> <span id="userName">User</span></span>
      </div>
    </aside>

    <main class="main-content">
      <header class="header">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="hamburger-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
          <h1>Sender WhatsApp</h1>
        </div>
        <div class="header-actions">
          <span class="clock" id="clock">--:--</span>
          <button class="btn-refresh" onclick="refreshDevices()"><i class="fas fa-sync-alt"></i></button>
        </div>
      </header>

      <div class="devices-content">

        <!-- DATA BAR -->
        <div class="data-available-bar fade-in">
          <div class="data-left">
            <div class="data-icon"><i class="fas fa-database"></i></div>
            <div>
              <div class="data-label">Nomor tersedia</div>
              <div class="data-value" id="dataAvailable">0</div>
            </div>
          </div>
          <button class="btn btn-primary" onclick="openQRModal()">
            <i class="fas fa-plus"></i> Add Device
            <span class="slot-badge" id="slotBadge">0/3</span>
          </button>
        </div>

        <!-- PERFORMANCE GRID -->
        <div class="section-title"><i class="fas fa-chart-bar"></i> Ringkasan Performa</div>

        <div class="stats-compact-grid">
          <div class="stat-box fade-in">
            <div class="stat-icon neutral"><i class="fas fa-layer-group"></i></div>
            <div class="stat-info">
              <div class="stat-value" id="perfSlotsActive">0</div>
              <div class="stat-label">Slot Aktif</div>
            </div>
          </div>
          <div class="stat-box fade-in">
            <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
            <div class="stat-info">
              <div class="stat-value" id="perfSuccess">0</div>
              <div class="stat-label">Chat Terkirim</div>
            </div>
          </div>
          <div class="stat-box fade-in">
            <div class="stat-icon offline"><i class="fas fa-times-circle"></i></div>
            <div class="stat-info">
              <div class="stat-value" id="perfFailed">0</div>
              <div class="stat-label">Gagal</div>
            </div>
          </div>
          <div class="stat-box fade-in">
            <div class="stat-icon sent"><i class="fas fa-chart-line"></i></div>
            <div class="stat-info">
              <div class="stat-value" id="perfCampaigns">0</div>
              <div class="stat-label">Campaign</div>
            </div>
          </div>
          <div class="stat-box fade-in">
            <div class="stat-icon revenue"><i class="fas fa-address-book"></i></div>
            <div class="stat-info">
              <div class="stat-value" id="perfUniqueContacts">0</div>
              <div class="stat-label">Nomor Unik</div>
            </div>
          </div>
          <div class="stat-box fade-in">
            <div class="stat-icon balance"><i class="fas fa-coins"></i></div>
            <div class="stat-info">
              <div class="stat-value" id="perfProfit">0</div>
              <div class="stat-label">Total Profit</div>
            </div>
          </div>
        </div>

        <!-- TOOLBAR -->
        <div class="device-toolbar">
          <div class="toolbar-row-1">
            <div class="btn-group">
              <button class="btn btn-sm btn-secondary" onclick="filterDevices('all')">Semua</button>
              <button class="btn btn-sm btn-secondary" onclick="filterDevices('connected')">Online</button>
              <button class="btn btn-sm btn-secondary" onclick="filterDevices('disconnected')">Offline</button>
            </div>
            <div class="btn-group">
              <button class="btn btn-sm btn-success" onclick="openQRModal()"><i class="fas fa-qrcode"></i> Scan QR</button>
              <button class="btn btn-sm btn-info" onclick="openPairingModal()"><i class="fas fa-link"></i> Pairing</button>
            </div>
          </div>
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="deviceSearch" placeholder="Cari Device ID / nomor" oninput="searchDevices()">
          </div>
        </div>

        <div id="devicesGrid" class="devices-grid"></div>
      </div>
    </main>
  </div>

  <!-- MODAL QR -->
  <div class="modal" id="qrModal">
    <div class="modal-content" style="max-width:460px;">
      <div class="modal-header">
        <h3><i class="fas fa-qrcode"></i> Scan QR WhatsApp</h3>
        <button class="modal-close" onclick="closeModal('qrModal')">&times;</button>
      </div>
      <div class="modal-body" style="text-align:center;">
        <div id="qrLoading" style="padding:20px;">
          <i class="fas fa-spinner fa-spin" style="font-size:36px;color:#3B82F6;"></i>
        </div>
        <img id="qrImage" src="" alt="QR" style="display:none;max-width:240px;border-radius:12px;border:2px solid rgba(59,130,246,0.4);margin:0 auto;">
        <p id="qrStatus" style="font-size:14px;color:#8B97AB;margin-top:14px;">Menyiapkan device...</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('qrModal')">Tutup</button>
      </div>
    </div>
  </div>

  <!-- MODAL PAIRING -->
  <div class="modal" id="pairingModal">
    <div class="modal-content" style="max-width:460px;">
      <div class="modal-header">
        <h3><i class="fas fa-link"></i> Pairing Code</h3>
        <button class="modal-close" onclick="closeModal('pairingModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="pairingPhoneArea">
          <div class="form-field">
            <label>Nomor HP WhatsApp</label>
            <div class="field-input">
              <i class="fas fa-phone"></i>
              <input type="tel" id="pairingPhone" placeholder="628123456789" maxlength="15">
            </div>
          </div>
          <button class="btn-main" onclick="startPairingCode()" id="pairingBtn" style="margin-top:14px;">
            <i class="fas fa-paper-plane"></i>
            <span>Dapatkan Kode</span>
          </button>
        </div>
        <div id="pairingCodeArea" style="display:none;text-align:center;">
          <p style="font-size:13px;color:#8B97AB;margin-bottom:12px;">Masukkan kode di WhatsApp:</p>
          <div style="background:rgba(6,8,15,0.6);border-radius:14px;padding:22px;border:2px dashed #3B82F6;">
            <div id="pairingCodeDisplay" style="font-size:34px;font-weight:800;letter-spacing:6px;color:#3B82F6;font-family:monospace;">------</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="helpers.js"></script>

  <script>
    let allDevices = [];
    let currentFilter = 'all';
    let searchTerm = '';
    const MAX_SLOTS = 3;
    const devicesGrid = document.getElementById('devicesGrid');
    window._watchers = {};
    window._blasting = {};
    window._speeds = {};
    window._progress = {};   // deviceId -> progress dari server
    let progressInterval = null;

    const SPEED_OPTIONS = [
      { value: 1000, label: '1 detik' },
      { value: 3000, label: '3 detik' },
      { value: 5000, label: '5 detik', selected: true },
      { value: 30000, label: '30 detik' },
      { value: 60000, label: '60 detik' }
    ];

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function animateNumber(elId, target) {
      const el = document.getElementById(elId);
      if (!el) return;
      const start = parseInt(el.textContent.replace(/\D/g, '')) || 0;
      if (start === target) { el.textContent = target.toLocaleString('id-ID'); return; }
      const duration = 700;
      const t0 = performance.now();
      function tick(now) {
        const p = Math.min((now - t0) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.floor(start + (target - start) * eased).toLocaleString('id-ID');
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function watchDeviceConnection(deviceId, deviceLabel, onConnected) {
      if (window._watchers[deviceId]) clearInterval(window._watchers[deviceId]);
      const start = Date.now();
      const interval = setInterval(async () => {
        if (Date.now() - start > 5 * 60 * 1000) { clearInterval(interval); delete window._watchers[deviceId]; return; }
        try {
          const res = await fetch('/api/devices', { credentials: 'include' });
          const devices = await res.json();
          const dev = devices.find(d => d.id === deviceId);
          if (dev && dev.real_status === 'connected') {
            clearInterval(interval);
            delete window._watchers[deviceId];
            if (typeof onConnected === 'function') onConnected();
            showToast('Device terhubung!', 'success');
            await loadDevices();
            await loadSummary();
          }
        } catch (e) {}
      }, 3000);
      window._watchers[deviceId] = interval;
    }

    async function openQRModal() {
      const modal = document.getElementById('qrModal');
      document.getElementById('qrImage').src = '';
      document.getElementById('qrImage').style.display = 'none';
      document.getElementById('qrLoading').style.display = 'block';
      document.getElementById('qrStatus').textContent = 'Menyiapkan device...';
      modal.classList.add('active');
      try {
        const name = 'Device-' + Date.now().toString(36).slice(-5);
        const createRes = await fetch('/api/devices', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone: '', siteId: 1 })
        });
        const createData = await createRes.json();
        if (!createRes.ok) throw new Error(createData.error || 'Gagal buat device');
        await loadDevices();
        await loadSummary();
        document.getElementById('qrStatus').textContent = 'Menunggu QR...';
        let qrData = null;
        for (let i = 0; i < 20; i++) {
          await new Promise(r => setTimeout(r, 1000));
          const qrRes = await fetch('/api/devices/' + createData.id + '/qr', { credentials: 'include' });
          qrData = await qrRes.json();
          if (qrData.qr) break;
        }
        if (!qrData || !qrData.qr) throw new Error('QR tidak tersedia');
        document.getElementById('qrLoading').style.display = 'none';
        document.getElementById('qrImage').src = qrData.qr;
        document.getElementById('qrImage').style.display = 'block';
        document.getElementById('qrStatus').textContent = 'Scan QR dengan WhatsApp';
        watchDeviceConnection(createData.id, createData.name, () => {
          setTimeout(() => closeModal('qrModal'), 2000);
        });
      } catch (err) {
        document.getElementById('qrLoading').style.display = 'none';
        document.getElementById('qrStatus').textContent = '❌ ' + err.message;
        document.getElementById('qrStatus').style.color = '#F87171';
      }
    }

    function openPairingModal() {
      document.getElementById('pairingModal').classList.add('active');
      document.getElementById('pairingPhoneArea').style.display = 'block';
      document.getElementById('pairingCodeArea').style.display = 'none';
      document.getElementById('pairingPhone').value = '';
    }

    async function startPairingCode() {
      const phone = document.getElementById('pairingPhone').value.trim();
      const btn = document.getElementById('pairingBtn');
      if (!phone) return showToast('Masukkan nomor HP', 'error');
      if (!/^[0-9]{10,15}$/.test(phone)) return showToast('Format nomor tidak valid', 'error');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
      try {
        const name = 'Device-' + phone.slice(-4);
        const createRes = await fetch('/api/devices', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, siteId: 1 })
        });
        const createData = await createRes.json();
        if (!createRes.ok) throw new Error(createData.error || 'Gagal');
        await loadDevices();
        const pairRes = await fetch('/api/devices/' + createData.id + '/pairing', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: phone })
        });
        const pairData = await pairRes.json();
        if (!pairRes.ok) throw new Error(pairData.error || 'Gagal');
        document.getElementById('pairingPhoneArea').style.display = 'none';
        document.getElementById('pairingCodeArea').style.display = 'block';
        document.getElementById('pairingCodeDisplay').textContent = pairData.code || '------';
        showToast('Kode pairing dibuat!', 'success');
        watchDeviceConnection(createData.id, createData.name, () => {
          setTimeout(() => closeModal('pairingModal'), 2000);
        });
      } catch (err) {
        showToast('Gagal: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>Dapatkan Kode</span>';
      }
    }

    async function loadSummary() {
      try {
        const res = await fetch('/api/devices/summary', { credentials: 'include' });
        if (!res.ok) return;
        const d = await res.json();
        animateNumber('dataAvailable', d.master_total || 0);
        document.getElementById('slotBadge').textContent = (d.devices_total || 0) + '/' + MAX_SLOTS;
        document.getElementById('perfSlotsActive').textContent = d.devices_connected || 0;
        animateNumber('perfSuccess', d.total_chat || 0);
        animateNumber('perfFailed', d.total_failed || 0);
        document.getElementById('perfCampaigns').textContent = d.total_campaigns || 0;
        animateNumber('perfUniqueContacts', d.unique_contacts || 0);
        animateNumber('perfProfit', d.total_profit || 0);
      } catch (e) { console.error(e); }
    }

    async function loadDevices() {
      try {
        const res = await fetch('/api/devices', { credentials: 'include' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        allDevices = Array.isArray(data) ? data : [];
        renderDevices();
      } catch (error) {
        allDevices = [];
        renderDevices();
      }
    }

    function renderDevices() {
      let filtered = [...allDevices];
      if (currentFilter !== 'all') filtered = filtered.filter(d => d.real_status === currentFilter);
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        filtered = filtered.filter(d =>
          (d.id && d.id.toLowerCase().includes(term)) ||
          (d.phone && d.phone.includes(term)) ||
          (d.name && d.name.toLowerCase().includes(term))
        );
      }

      if (filtered.length === 0) {
        devicesGrid.innerHTML = '<div class="empty-device-state"><div class="empty-icon"><i class="fas fa-mobile-alt"></i></div><h3>Belum Ada Device</h3><p>Tambahkan perangkat untuk mulai blast.</p><button class="btn btn-primary" onclick="openQRModal()"><i class="fas fa-plus"></i> Tambah Device</button></div>';
        return;
      }

      devicesGrid.innerHTML = filtered.map(d => {
        const progress = window._progress[d.id];
        const isBlasting = progress && progress.running;
        const isProgress = progress && (progress.running || progress.status === 'done' || progress.status === 'failed');

        let actionButtons = '';

        if (d.real_status === 'connected') {
          if (isBlasting) {
            // Sedang blasting — tampilkan STOP
            actionButtons = '<button class="btn-blast-stop" onclick="stopBlast(\'' + d.id + '\')"><i class="fas fa-stop"></i> Stop Blast</button>';
          } else {
            const currentSpeed = window._speeds[d.id] || 5000;
            const speedOpts = SPEED_OPTIONS.map(o =>
              '<option value="' + o.value + '"' + (currentSpeed === o.value ? ' selected' : '') + '>' + o.label + '</option>'
            ).join('');
            actionButtons =
              '<select id="speed-' + d.id + '" class="speed-select-compact" onchange="window._speeds[\'' + d.id + '\'] = parseInt(this.value)">' + speedOpts + '</select>' +
              '<button class="btn-blast-start" onclick="blastAll(\'' + d.id + '\')"><i class="fas fa-play"></i> Start Blast</button>';
          }
          actionButtons +=
            '<button class="btn-icon-sm" onclick="showQR(\'' + d.id + '\')" title="Lihat QR"><i class="fas fa-qrcode"></i></button>' +
            '<button class="btn-icon-sm danger" onclick="deleteDevice(\'' + d.id + '\')" title="Hapus Device"><i class="fas fa-trash"></i></button>';
        } else {
          actionButtons =
            '<button class="btn-blast-start" disabled><i class="fas fa-play"></i> Start Blast</button>' +
            '<button class="btn-icon-sm danger" onclick="deleteDevice(\'' + d.id + '\')" title="Hapus Device"><i class="fas fa-trash"></i></button>';
        }

        const statusLabel = isBlasting ? 'BLASTING' : (d.real_status || '').toUpperCase();
        const statusClass = isBlasting ? 'blasting' : d.real_status;

        // Progress bar
        let progressHtml = '';
        if (isProgress && progress.total > 0) {
          const pct = progress.percent || Math.floor((progress.sent / progress.total) * 100);
          const done = progress.status === 'done';
          const failed = progress.status === 'failed';
          const bgColor = done ? 'linear-gradient(90deg,#34D399,#059669)' : (failed ? 'linear-gradient(90deg,#EF4444,#B91C1C)' : 'linear-gradient(90deg,#3B82F6,#2563EB)');
          progressHtml = '<div style="margin:10px 0; padding:10px 12px; background:rgba(59,130,246,0.06); border:1px solid rgba(59,130,246,0.2); border-radius:10px;">' +
            '<div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px;">' +
              '<span style="color:#93C5FD;">' + (done ? '✅ Selesai' : (failed ? '❌ Gagal' : '<i class="fas fa-spinner fa-spin"></i> Blasting')) + '</span>' +
              '<span style="font-weight:700; color:#E8EFFB;">' + progress.sent + ' / ' + progress.total + '</span>' +
            '</div>' +
            '<div style="height:6px; background:rgba(0,0,0,0.3); border-radius:3px; overflow:hidden;">' +
              '<div style="height:100%; width:' + pct + '%; background:' + bgColor + '; transition:width 0.4s ease;"></div>' +
            '</div>' +
            '<div style="font-size:11px; color:#8B97AB; margin-top:4px; text-align:right;">' + pct + '%' + (progress.failed > 0 ? ' • ' + progress.failed + ' gagal' : '') + '</div>' +
          '</div>';
        }

        return '<div class="device-card fade-in" data-id="' + d.id + '">' +
          '<div class="device-header">' +
            '<div class="device-info"><span class="device-id">' + d.id + '</span><span class="device-status ' + statusClass + '">' + statusLabel + '</span></div>' +
            '<div class="device-phone">' + (d.phone || 'Belum tersambung') + '</div>' +
          '</div>' +
          '<div class="device-stats-row">' +
            '<span><i class="fas fa-check-circle"></i> Terkirim ' + (d.sent || 0) + '</span>' +
            '<span><i class="fas fa-coins"></i> Profit ' + (d.profit || 0).toLocaleString('id-ID') + '</span>' +
            '<span class="device-mode">' + (d.mode || 'FAST (1s)') + '</span>' +
          '</div>' +
          progressHtml +
          '<div class="device-actions">' + actionButtons + '</div>' +
        '</div>';
      }).join('');
    }

    function filterDevices(filter) { currentFilter = filter; renderDevices(); }
    function searchDevices() { searchTerm = document.getElementById('deviceSearch').value.trim(); renderDevices(); }

    async function stopBlast(deviceId) {
      if (!confirm('Stop blast device ini?')) return;
      try {
        await fetch('/api/devices/' + deviceId + '/stop', { method: 'POST', credentials: 'include' });
        showToast('Blast dihentikan', 'warning');
        window._blasting[deviceId] = false;
        await loadDevices();
      } catch (e) { showToast('Gagal stop', 'error'); }
    }

    async function deleteDevice(id) {
      if (!confirm('Hapus device ini?')) return;
      try {
        await fetch('/api/devices/' + id, { method: 'DELETE', credentials: 'include' });
        showToast('Device dihapus', 'success');
        loadDevices(); loadSummary();
      } catch (e) { showToast('Gagal hapus', 'error'); }
    }

    async function showQR(deviceId) {
      try {
        const res = await fetch('/api/devices/' + deviceId + '/qr', { credentials: 'include' });
        const data = await res.json();
        if (!data.qr) return showToast('Tidak ada QR', 'warning');
        const win = window.open('', '_blank');
        win.document.write('<html><body style="background:#050810;color:#fff;text-align:center;padding:40px;"><h3>Scan QR</h3><img src="' + data.qr + '" style="max-width:300px;"></body></html>');
      } catch (e) { showToast('Gagal ambil QR', 'error'); }
    }

    // BLAST — fire and forget + polling progress
    async function blastAll(deviceId) {
      const device = allDevices.find(d => d.id === deviceId);
      if (!device || device.real_status !== 'connected') return showToast('Device offline', 'error');

      const speed = window._speeds[deviceId] || 5000;

      // Set UI state blasting
      window._blasting[deviceId] = true;
      window._progress[deviceId] = { running: true, total: 0, sent: 0, failed: 0, percent: 0 };
      renderDevices();

      try {
        showToast('🚀 Blast dimulai (' + (speed/1000) + 's)...', 'info');

        const blastRes = await fetch('/api/broadcast', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ deviceId, speed })
        });
        const data = await blastRes.json();
        if (!blastRes.ok) throw new Error(data.error || 'Gagal');

        // Update progress awal dengan total dari server
        window._progress[deviceId] = {
          running: true, total: data.total || 0,
          sent: 0, failed: 0, percent: 0, status: 'running'
        };
        renderDevices();

        // Mulai polling progress
        startProgressPolling(deviceId);

        showToast('Blast berjalan di background. Progress muncul di card.', 'success');
      } catch (err) {
        showToast('Gagal: ' + err.message, 'error');
        window._blasting[deviceId] = false;
        window._progress[deviceId] = null;
        renderDevices();
      }
    }

    // Polling progress tiap 2 detik
    function startProgressPolling(deviceId) {
      if (window._progressIntervals && window._progressIntervals[deviceId]) {
        clearInterval(window._progressIntervals[deviceId]);
      }
      if (!window._progressIntervals) window._progressIntervals = {};

      window._progressIntervals[deviceId] = setInterval(async () => {
        try {
          const res = await fetch('/api/broadcast/progress/' + deviceId, { credentials: 'include' });
          const data = await res.json();

          if (!data.running && (!data.status || data.status === 'done' || data.status === 'failed')) {
            // Selesai
            window._progress[deviceId] = data.status ? data : null;
            window._blasting[deviceId] = false;
            clearInterval(window._progressIntervals[deviceId]);
            delete window._progressIntervals[deviceId];

            // Update device stats
            await loadDevices();
            await loadSummary();

            // Clear progress setelah 5 detik
            setTimeout(() => {
              window._progress[deviceId] = null;
              renderDevices();
            }, 5000);
          } else {
            window._progress[deviceId] = data;
            window._blasting[deviceId] = true;
            renderDevices();
          }
        } catch (e) {
          console.error('Progress poll error:', e);
        }
      }, 2000);
    }

    async function refreshDevices() {
      await Promise.all([loadDevices(), loadSummary()]);
      showToast('Data diperbarui', 'info');
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadDevices();
      loadSummary();
      updateClock();
      setInterval(updateClock, 1000);
      setInterval(loadDevices, 10000);
      setInterval(loadSummary, 30000);

      fetch('/api/me', { credentials: 'include' })
        .then(r => r.ok ? r.json() : null)
        .then(u => {
          if (!u) return;
          document.getElementById('userName').textContent = u.name || u.email;
          if (u.role === 'admin') document.getElementById('adminLink').style.display = 'flex';
        })
        .catch(() => {});

      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('Yakin logout?')) return;
        await fetch('/api/logout', { method: 'POST', credentials: 'include' });
        window.location.href = '/';
      });
    });
  </script>
</body>
</html>
