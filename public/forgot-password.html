<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketingCuan - Lupa Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-brand">
        <i class="fab fa-whatsapp"></i>
        <span>Marketing<span class="highlight">Cuan</span></span>
        <small>Reset Password</small>
      </div>

      <form id="forgotForm" class="login-form">
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="resetEmail" class="form-control" placeholder="nama@domain.com" required>
          <small style="font-size:12px;color:var(--text-muted);">Masukkan email terdaftar Anda</small>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">
          <i class="fas fa-paper-plane"></i> Kirim Link Reset
        </button>

        <div class="register-link">
          <a href="/">Kembali ke Login</a>
        </div>
      </form>

      <div id="forgotResult" style="margin-top:12px;"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const btn = document.getElementById('forgotBtn');
      const resultDiv = document.getElementById('forgotResult');

      if (!email) {
        showToast('Masukkan email terlebih dahulu', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';
      resultDiv.innerHTML = '';

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (res.ok) {
          resultDiv.innerHTML = `
            <div class="alert alert-success">
              ✅ ${data.message || 'Link reset password telah dikirim ke email Anda.'}
            </div>
          `;
          document.getElementById('resetEmail').value = '';
        } else {
          resultDiv.innerHTML = `<div class="alert alert-danger">❌ ${data.error || 'Terjadi kesalahan'}</div>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger">❌ Gagal menghubungi server</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Link Reset';
      }
    });

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
</body>
</html>
