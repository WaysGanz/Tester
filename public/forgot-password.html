<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <title>Lupa Password — SewaWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Animasi fade-in bertingkat */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-1 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.05s; }
    .anim-2 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.15s; }
    .anim-3 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.25s; }
    .anim-4 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.35s; }
    .anim-5 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.45s; }

    /* Shake kalau error */
    @keyframes shakeErr {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake { animation: shakeErr 0.4s ease; }

    /* Icon key float */
    @keyframes floatKey {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(-3deg); }
    }
    .float-key { animation: floatKey 2.5s ease-in-out infinite; }

    /* Success check pop */
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* Glow teks title */
    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(59,130,246,0.5); }
      50% { text-shadow: 0 0 40px rgba(59,130,246,0.9), 0 0 60px rgba(59,130,246,0.5); }
    }
    .text-glow { animation: textGlow 3s ease-in-out infinite; }
  </style>
</head>
<body class="login-page">

  <!-- Background -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
  <div class="bg-particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-fullscreen">
    <div class="login-content">

      <!-- HEADER -->
      <div class="login-header anim-1">
        <div class="logo-container">
          <div class="logo-ring"></div>
          <div class="logo-ring logo-ring-2"></div>
          <div class="logo-core">
            <i class="fas fa-key float-key"></i>
          </div>
        </div>
        <h1 class="login-title text-glow">Lupa <span>Password</span>?</h1>
        <p class="login-tagline">Masukkan email Anda, kami kirim link reset.</p>
      </div>

      <!-- FORM -->
      <form id="forgotForm" class="login-form-full">
        <div class="form-field anim-2">
          <label>Email Terdaftar</label>
          <div class="field-input">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="nama@domain.com" required autocomplete="email">
          </div>
        </div>

        <button type="submit" class="btn-main anim-3" id="submitBtn">
          <i class="fas fa-paper-plane"></i>
          <span>Kirim Link Reset</span>
        </button>
      </form>

      <!-- RESULT -->
      <div id="resultMsg" class="anim-4" style="margin-top:16px;"></div>

      <!-- DIVIDER -->
      <div class="divider anim-4">
        <span></span>
        <small>atau</small>
        <span></span>
      </div>

      <!-- BACK TO LOGIN -->
      <a href="/" class="btn-secondary-full anim-5">
        <i class="fas fa-arrow-left"></i>
        Kembali ke Login
      </a>

    </div>

    <div class="copyright-full">
      © 2026 SewaWA. All rights reserved.
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="helpers.js"></script>

  <script>
    const form = document.getElementById('forgotForm');
    const btn = document.getElementById('submitBtn');
    const resultMsg = document.getElementById('resultMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return showToast('Email wajib diisi', 'error');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Mengirim...</span>';
      resultMsg.innerHTML = '';

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Gagal kirim');

        resultMsg.innerHTML =
          '<div class="alert alert-success pop-in" style="font-size:13px;">' +
            '<i class="fas fa-check-circle"></i> ' +
            (data.message || 'Jika email terdaftar, link reset telah dikirim. Cek inbox & spam.') +
          '</div>';
        showToast('Link reset dikirim!', 'success');
        form.reset();
      } catch (err) {
        resultMsg.innerHTML =
          '<div class="alert alert-danger shake" style="font-size:13px;">' +
            '<i class="fas fa-times-circle"></i> ' + err.message +
          '</div>';
        showToast('Gagal: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>Kirim Link Reset</span>';
      }
    });
  </script>
</body>
</html>
