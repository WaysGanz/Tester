<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BastardBlast Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">B</div>
      <div>
        <div class="brand-text">BastardBlast</div>
        <div class="brand-sub">Admin Panel</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <div class="sidebar-user" onclick="logout()">
        <div class="avatar" id="sbAvatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sbName">Admin</div>
          <div class="sidebar-user-role" id="sbRole">owner</div>
        </div>
        <i class="fas fa-arrow-right-from-bracket" style="color:#9ca3af;font-size:13px;"></i>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="topbar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="global-search">
        <div class="global-search-input">
          <i class="fas fa-magnifying-glass"></i>
          <input type="text" id="globalSearch" placeholder="Cari user, nomor, campaign, device, tiket..." autocomplete="off">
          <span class="global-search-kbd">/</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="showNotifications()" title="Notifikasi">
          <i class="fas fa-bell"></i>
          <span class="dot" id="notifDot" style="display:none;"></span>
        </button>
        <button class="icon-btn" onclick="refreshPage()" title="Refresh"><i class="fas fa-rotate"></i></button>
        <button class="icon-btn" onclick="toggleThemeInfo()" title="Info"><i class="fas fa-circle-info"></i></button>
      </div>
    </header>

    <main class="content" id="pageContent"></main>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="modalTitle">Modal</div>
        <div class="modal-sub" id="modalSub"></div>
      </div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<script src="app.js"></script>
</body>
</html>
