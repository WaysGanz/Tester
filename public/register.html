<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <title>Daftar — SewaWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">

  <!-- Animated Background -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
  <div class="bg-particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Full Screen Register -->
  <div class="login-fullscreen">
    <div class="login-content register-content">

      <!-- Logo & Brand -->
      <div class="login-header">
        <div class="logo-container">
          <div class="logo-ring"></div>
          <div class="logo-ring logo-ring-2"></div>
          <div class="logo-core">
            <i class="fab fa-whatsapp"></i>
          </div>
        </div>
        <h1 class="login-title">Sewa<span>WA</span></h1>
        <p class="login-tagline">Daftar Akun Baru</p>
      </div>

      <!-- Form -->
      <form id="registerForm" class="login-form-full">

        <!-- STEP 1 -->
        <div id="step1">
          <div class="step-label">
            <span class="step-dot active"></span>
            <span class="step-dot"></span>
            <small>Langkah 1 dari 2</small>
          </div>

          <div class="form-field">
            <label>Email</label>
            <div class="field-input">
              <i class="fas fa-envelope"></i>
              <input 
                type="email" 
                id="registerEmail" 
                placeholder="nama@domain.com" 
                autocomplete="email"
              >
            </div>
          </div>

          <div class="form-field">
            <label>Username</label>
            <div class="field-input">
              <i class="fas fa-user"></i>
              <input 
                type="text" 
                id="registerUsername" 
                placeholder="5-20 karakter" 
                autocomplete="username"
              >
            </div>
          </div>

          <button type="button" class="btn-main" onclick="nextStep()">
            <span>Lanjut</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>

        <!-- STEP 2 -->
        <div id="step2" style="display:none;">
          <div class="step-label">
            <span class="step-dot"></span>
            <span class="step-dot active"></span>
            <small>Langkah 2 dari 2</small>
          </div>

          <div class="form-field">
            <label>Nomor WhatsApp</label>
            <div class="field-input">
              <i class="fas fa-phone"></i>
              <input 
                type="tel" 
                id="registerPhone" 
                placeholder="628xxxxxxxxxx" 
                autocomplete="tel"
              >
            </div>
          </div>

          <div class="form-field">
            <label>Password</label>
            <div class="field-input">
              <i class="fas fa-lock"></i>
              <input 
                type="password" 
                id="registerPassword" 
                placeholder="Minimal 8 karakter" 
                autocomplete="new-password"
              >
            </div>
          </div>

          <div class="form-field">
            <label>Konfirmasi Password</label>
            <div class="field-input">
              <i class="fas fa-lock"></i>
              <input 
                type="password" 
                id="registerPasswordConfirm" 
                placeholder="Ulangi password" 
                autocomplete="new-password"
              >
            </div>
          </div>

          <!-- Strength Meter -->
          <div class="strength-wrap">
            <div class="strength-track">
              <div class="strength-bar" id="strengthBar"></div>
            </div>
            <small id="strengthLabel">Kekuatan password</small>
          </div>

          <!-- Human Check -->
          <label class="human-check" style="margin:14px 0 16px;">
            <input type="checkbox" id="humanCheckRegister" checked>
            <span class="checkmark"></span>
            <span>Aku manusia</span>
          </label>

          <!-- Buttons -->
          <div class="btn-row">
            <button type="button" class="btn-ghost" onclick="prevStep()">
              <i class="fas fa-arrow-left"></i>
            </button>
            <button type="submit" class="btn-main" id="registerBtn">
              <span>Daftar</span>
              <i class="fas fa-check"></i>
            </button>
          </div>
        </div>

      </form>

      <!-- Login Link -->
      <p class="terms-text" style="margin-top:24px;">
        Sudah punya akun? <a href="/">Masuk di sini</a>
      </p>

    </div>

    <!-- Copyright -->
    <p class="copyright-full">© 2026 SewaWA. All rights reserved.</p>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    const referralRef = new URLSearchParams(window.location.search).get('ref');

    // Password strength meter
    document.getElementById('registerPassword').addEventListener('input', function() {
      const p = this.value;
      let s = 0;
      if (p.length >= 8) s += 25;
      if (p.length >= 12) s += 25;
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s += 25;
      if (/[0-9]/.test(p)) s += 25;

      const bar = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');

      if (s <= 25) { label.textContent = 'Lemah'; bar.style.background = '#EF4444'; }
      else if (s <= 50) { label.textContent = 'Cukup'; bar.style.background = '#F59E0B'; }
      else if (s <= 75) { label.textContent = 'Baik'; bar.style.background = '#3B82F6'; }
      else { label.textContent = 'Sangat Kuat'; bar.style.background = '#10B981'; }

      bar.style.width = s + '%';
    });

    function nextStep() {
      const email = document.getElementById('registerEmail').value.trim();
      const username = document.getElementById('registerUsername').value.trim();

      if (!email || !username) return showToast('Email & username wajib diisi', 'error');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showToast('Email tidak valid', 'error');
      if (username.length < 5 || username.length > 20) return showToast('Username 5-20 karakter', 'error');
      if (!/^[a-zA-Z0-9_]+$/.test(username)) return showToast('Username hanya huruf, angka, underscore', 'error');

      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }

    function prevStep() {
      document.getElementById('step1').style.display = 'block';
      document.getElementById('step2').style.display = 'none';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!document.getElementById('humanCheckRegister').checked) {
        return showToast('Centang "Aku manusia"', 'error');
      }

      const email = document.getElementById('registerEmail').value.trim();
      const username = document.getElementById('registerUsername').value.trim();
      const phone = document.getElementById('registerPhone').value.trim();
      const password = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerPasswordConfirm').value;

      if (!email || !username || !phone || !password) return showToast('Semua field wajib diisi', 'error');
      if (password !== confirm) return showToast('Password tidak cocok', 'error');
      if (password.length < 8) return showToast('Password minimal 8 karakter', 'error');
      if (!/^\d{10,15}$/.test(phone)) return showToast('Format nomor tidak valid', 'error');

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Mendaftarkan...</span>';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, username, phone, password, ref: referralRef })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Pendaftaran gagal');

        showToast('✅ Akun berhasil dibuat!', 'success');
        setTimeout(() => window.location.href = '/', 1500);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Daftar</span><i class="fas fa-check"></i>';
      }
    });

    function showToast(msg, type = 'info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 300);
      }, 3500);
    }
  </script>
</body>
</html>
