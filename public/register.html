<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <title>Daftar — SewaWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">

  <!-- Animated Background -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
  <div class="bg-particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- Full Screen Register (SAMA KAYAK LOGIN) -->
  <div class="login-fullscreen">
    <div class="login-content">

      <!-- Logo & Brand (SAMA KAYAK LOGIN) -->
      <div class="login-header">
        <div class="logo-container">
          <div class="logo-ring"></div>
          <div class="logo-ring logo-ring-2"></div>
          <div class="logo-core">
            <i class="fab fa-whatsapp"></i>
          </div>
        </div>
        <h1 class="login-title">Sewa<span>WA</span></h1>
        <p class="login-tagline">Daftar Akun Baru</p>
      </div>

      <!-- Form (1 LANGKAH) -->
      <form id="registerForm" class="login-form-full">

        <div class="form-field">
          <label>Email</label>
          <div class="field-input">
            <i class="fas fa-envelope"></i>
            <input 
              type="email" 
              id="registerEmail" 
              placeholder="nama@domain.com" 
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div class="form-field">
          <label>Username</label>
          <div class="field-input">
            <i class="fas fa-user"></i>
            <input 
              type="text" 
              id="registerUsername" 
              placeholder="5-20 karakter" 
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-field">
          <label>Nomor WhatsApp</label>
          <div class="field-input">
            <i class="fas fa-phone"></i>
            <input 
              type="tel" 
              id="registerPhone" 
              placeholder="628xxxxxxxxxx" 
              autocomplete="tel"
              required
            >
          </div>
        </div>

        <div class="form-field">
          <label>Password</label>
          <div class="field-input">
            <i class="fas fa-lock"></i>
            <input 
              type="password" 
              id="registerPassword" 
              placeholder="Minimal 8 karakter" 
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-pwd" onclick="togglePwd('registerPassword', 'eyeReg1')">
              <i class="fas fa-eye" id="eyeReg1"></i>
            </button>
          </div>
        </div>

        <div class="form-field">
          <label>Konfirmasi Password</label>
          <div class="field-input">
            <i class="fas fa-lock"></i>
            <input 
              type="password" 
              id="registerPasswordConfirm" 
              placeholder="Ulangi password" 
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-pwd" onclick="togglePwd('registerPasswordConfirm', 'eyeReg2')">
              <i class="fas fa-eye" id="eyeReg2"></i>
            </button>
          </div>
        </div>

        <!-- Password Strength -->
        <div class="strength-wrap" style="margin-top:-6px;">
          <div class="strength-track">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <small id="strengthLabel">Kekuatan password</small>
        </div>

        <!-- Human Check (SAMA KAYAK LOGIN) -->
        <div class="form-row-options" style="margin:8px 0 4px;">
          <label class="human-check">
            <input type="checkbox" id="humanCheckRegister" checked>
            <span class="checkmark"></span>
            <span>Aku manusia</span>
          </label>
          <a href="/" class="link-forgot">Sudah punya akun?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-main" id="registerBtn">
          <span>Daftar Sekarang</span>
          <i class="fas fa-arrow-right"></i>
        </button>

      </form>

      <!-- Divider -->
      <div class="divider">
        <span></span>
        <small>atau</small>
        <span></span>
      </div>

      <!-- Login -->
      <a href="/" class="btn-secondary-full">
        <i class="fas fa-sign-in-alt"></i>
        <span>Masuk ke Akun</span>
      </a>

      <!-- Terms -->
      <p class="terms-text">
        Dengan mendaftar, Anda menyetujui 
        <a href="#">Ketentuan</a> & 
        <a href="#">Kebijakan Privasi</a>
      </p>

    </div>

    <p class="copyright-full">© 2026 SewaWA. All rights reserved.</p>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    const referralRef = new URLSearchParams(window.location.search).get('ref');

    function togglePwd(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    document.getElementById('registerPassword').addEventListener('input', function() {
      const p = this.value;
      let s = 0;
      if (p.length >= 8) s += 25;
      if (p.length >= 12) s += 25;
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s += 25;
      if (/[0-9]/.test(p)) s += 25;

      const bar = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');

      if (s <= 25) { label.textContent = 'Lemah'; bar.style.background = '#EF4444'; }
      else if (s <= 50) { label.textContent = 'Cukup'; bar.style.background = '#F59E0B'; }
      else if (s <= 75) { label.textContent = 'Baik'; bar.style.background = '#3B82F6'; }
      else { label.textContent = 'Sangat Kuat'; bar.style.background = '#10B981'; }

      bar.style.width = s + '%';
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!document.getElementById('humanCheckRegister').checked) {
        return showToast('Centang "Aku manusia"', 'error');
      }

      const email = document.getElementById('registerEmail').value.trim();
      const username = document.getElementById('registerUsername').value.trim();
      const phone = document.getElementById('registerPhone').value.trim();
      const password = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerPasswordConfirm').value;

      if (!email || !username || !phone || !password) {
        return showToast('Semua field wajib diisi', 'error');
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        return showToast('Email tidak valid', 'error');
      }
      if (username.length < 5 || username.length > 20) {
        return showToast('Username 5-20 karakter', 'error');
      }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        return showToast('Username hanya huruf, angka, underscore', 'error');
      }
      if (!/^\d{10,15}$/.test(phone)) {
        return showToast('Format nomor WhatsApp tidak valid', 'error');
      }
      if (password.length < 8) {
        return showToast('Password minimal 8 karakter', 'error');
      }
      if (password !== confirm) {
        return showToast('Password tidak cocok', 'error');
      }

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Mendaftarkan...</span>';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, username, phone, password, ref: referralRef })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Pendaftaran gagal');

        showToast('✅ Akun berhasil dibuat!', 'success');
        setTimeout(() => window.location.href = '/', 1500);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Daftar Sekarang</span><i class="fas fa-arrow-right"></i>';
      }
    });

    function showToast(msg, type = 'info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 300);
      }, 3500);
    }
  </script>
</body>
</html>
