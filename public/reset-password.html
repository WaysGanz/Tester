<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketingCuan - Reset Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-brand">
        <i class="fab fa-whatsapp"></i>
        <span>Marketing<span class="highlight">Cuan</span></span>
        <small>Buat Password Baru</small>
      </div>

      <form id="resetForm" class="login-form">
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password Baru</label>
          <input type="password" id="newPassword" class="form-control" placeholder="Minimal 8 karakter" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Konfirmasi Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password" required>
        </div>

        <div id="passwordStrength" style="margin-bottom:12px;">
          <div style="height:4px;background:#e0e0e0;border-radius:4px;overflow:hidden;">
            <div id="strengthFill" style="height:100%;width:0%;transition:width 0.3s;"></div>
          </div>
          <span id="strengthText" style="font-size:12px;color:var(--text-muted);">Kekuatan password</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
          <i class="fas fa-save"></i> Reset Password
        </button>

        <div class="register-link">
          <a href="/">Kembali ke Login</a>
        </div>
      </form>

      <div id="resetResult" style="margin-top:12px;"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    document.getElementById('newPassword').addEventListener('input', function() {
      const password = this.value;
      let strength = 0;
      let text = '';
      let color = '#e0e0e0';

      if (password.length >= 8) strength += 25;
      if (password.length >= 12) strength += 25;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
      if (/[0-9]/.test(password)) strength += 25;

      if (strength <= 25) { text = 'Lemah'; color = '#EF4444'; }
      else if (strength <= 50) { text = 'Cukup'; color = '#F59E0B'; }
      else if (strength <= 75) { text = 'Baik'; color = '#3B82F6'; }
      else { text = 'Sangat Kuat'; color = '#10B981'; }

      document.getElementById('strengthFill').style.width = strength + '%';
      document.getElementById('strengthFill').style.backgroundColor = color;
      document.getElementById('strengthText').textContent = text;
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!token) {
        showToast('Token tidak valid atau sudah kadaluwarsa', 'error');
        return;
      }

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const resultDiv = document.getElementById('resetResult');
      const btn = document.getElementById('resetBtn');

      if (!newPassword || !confirmPassword) {
        showToast('Semua field wajib diisi', 'error');
        return;
      }

      if (newPassword.length < 8) {
        showToast('Password minimal 8 karakter', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showToast('Password tidak cocok', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
      resultDiv.innerHTML = '';

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();

        if (res.ok) {
          resultDiv.innerHTML = `
            <div class="alert alert-success">
              ✅ ${data.message || 'Password berhasil direset!'}
              <br><a href="/" style="color:var(--primary);font-weight:600;">Klik di sini untuk login</a>
            </div>
          `;
          setTimeout(() => window.location.href = '/', 3000);
        } else {
          resultDiv.innerHTML = `<div class="alert alert-danger">❌ ${data.error || 'Gagal reset password'}</div>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger">❌ Gagal menghubungi server</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
      }
    });

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }
  </script>
</body>
</html>
