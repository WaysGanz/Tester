<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <title>Reset Password — SewaWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Animasi fade-in bertingkat */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-1 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.05s; }
    .anim-2 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.15s; }
    .anim-3 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.25s; }
    .anim-4 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.35s; }
    .anim-5 { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) backwards; animation-delay: 0.45s; }

    /* Shake kalau error */
    @keyframes shakeErr {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake { animation: shakeErr 0.4s ease; }

    /* Icon lock pulse */
    @keyframes pulseLock {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .pulse-lock { animation: pulseLock 2s ease-in-out infinite; }

    /* Success check pop */
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* Glow teks title */
    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(59,130,246,0.5); }
      50% { text-shadow: 0 0 40px rgba(59,130,246,0.9), 0 0 60px rgba(59,130,246,0.5); }
    }
    .text-glow { animation: textGlow 3s ease-in-out infinite; }
  </style>
</head>
<body class="login-page">

  <!-- Background -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>
  <div class="bg-particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-fullscreen">
    <div class="login-content">

      <!-- HEADER -->
      <div class="login-header anim-1">
        <div class="logo-container">
          <div class="logo-ring"></div>
          <div class="logo-ring logo-ring-2"></div>
          <div class="logo-core">
            <i class="fas fa-lock pulse-lock"></i>
          </div>
        </div>
        <h1 class="login-title text-glow">Reset <span>Password</span></h1>
        <p class="login-tagline">Buat password baru yang kuat & aman.</p>
      </div>

      <!-- FORM -->
      <form id="resetForm" class="login-form-full">

        <div class="form-field anim-2">
          <label>Password Baru</label>
          <div class="field-input">
            <i class="fas fa-lock"></i>
            <input type="password" id="newPassword" placeholder="Minimal 8 karakter" required minlength="8" autocomplete="new-password">
            <button type="button" class="toggle-pwd" onclick="togglePwd('newPassword', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Strength Bar -->
        <div class="strength-wrap anim-2" id="strengthWrap" style="display:none; margin-top:-6px;">
          <div class="strength-track">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <small id="strengthText">-</small>
        </div>

        <div class="form-field anim-3">
          <label>Konfirmasi Password</label>
          <div class="field-input">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="Ulangi password baru" required autocomplete="new-password">
            <button type="button" class="toggle-pwd" onclick="togglePwd('confirmPassword', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-main anim-4" id="submitBtn">
          <i class="fas fa-check-circle"></i>
          <span>Reset Password</span>
        </button>
      </form>

      <!-- RESULT -->
      <div id="resultMsg" class="anim-4" style="margin-top:16px;"></div>

      <!-- DIVIDER -->
      <div class="divider anim-5">
        <span></span>
        <small>atau</small>
        <span></span>
      </div>

      <!-- BACK TO LOGIN -->
      <a href="/" class="btn-secondary-full anim-5">
        <i class="fas fa-arrow-left"></i>
        Kembali ke Login
      </a>

    </div>

    <div class="copyright-full">
      © 2026 SewaWA. All rights reserved.
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="helpers.js"></script>

  <script>
    const form = document.getElementById('resetForm');
    const btn = document.getElementById('submitBtn');
    const resultMsg = document.getElementById('resultMsg');
    const newPwd = document.getElementById('newPassword');
    const confirmPwd = document.getElementById('confirmPassword');
    const strengthWrap = document.getElementById('strengthWrap');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    // Ambil token dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      resultMsg.innerHTML =
        '<div class="alert alert-danger shake" style="font-size:13px;">' +
          '<i class="fas fa-times-circle"></i> Link reset tidak valid. Minta link baru di halaman Lupa Password.' +
        '</div>';
      form.style.display = 'none';
      setTimeout(() => { window.location.href = '/forgot-password'; }, 3000);
    }

    // Toggle show/hide password
    function togglePwd(inputId, el) {
      const input = document.getElementById(inputId);
      const icon = el.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    // Password strength realtime
    newPwd.addEventListener('input', function () {
      const val = this.value;
      if (!val) { strengthWrap.style.display = 'none'; return; }
      strengthWrap.style.display = 'flex';

      let score = 0;
      if (val.length >= 8) score++;
      if (val.length >= 12) score++;
      if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^a-zA-Z0-9]/.test(val)) score++;

      const levels = [
        { pct: 20, color: '#EF4444', text: 'Sangat Lemah' },
        { pct: 40, color: '#F87171', text: 'Lemah' },
        { pct: 60, color: '#FBBF24', text: 'Sedang' },
        { pct: 80, color: '#34D399', text: 'Kuat' },
        { pct: 100, color: '#3B82F6', text: 'Sangat Kuat' }
      ];
      const lvl = levels[Math.min(score, 4)];
      strengthBar.style.width = lvl.pct + '%';
      strengthBar.style.background = lvl.color;
      strengthText.textContent = lvl.text;
      strengthText.style.color = lvl.color;
    });

    // Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = newPwd.value;
      const confirm = confirmPwd.value;

      if (!password || password.length < 8) return showToast('Password minimal 8 karakter', 'error');
      if (password !== confirm) {
        resultMsg.innerHTML = '<div class="alert alert-danger shake" style="font-size:13px;"><i class="fas fa-times-circle"></i> Konfirmasi password tidak sama</div>';
        return showToast('Konfirmasi password tidak sama', 'error');
      }
      if (!token) return showToast('Token tidak valid', 'error');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Memproses...</span>';
      resultMsg.innerHTML = '';

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Gagal reset');

        resultMsg.innerHTML =
          '<div class="alert alert-success pop-in" style="font-size:13px;">' +
            '<i class="fas fa-check-circle"></i> ' + (data.message || 'Password berhasil direset!') +
            '<br><small style="opacity:0.85;">Mengalihkan ke login...</small>' +
          '</div>';
        showToast('Password berhasil direset!', 'success');
        setTimeout(() => { window.location.href = '/'; }, 1800);
      } catch (err) {
        resultMsg.innerHTML =
          '<div class="alert alert-danger shake" style="font-size:13px;">' +
            '<i class="fas fa-times-circle"></i> ' + err.message +
          '</div>';
        showToast('Gagal: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> <span>Reset Password</span>';
      }
    });
  </script>
</body>
</html>
